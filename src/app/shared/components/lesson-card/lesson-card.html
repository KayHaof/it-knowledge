<article class="card lesson-card"><div class="card-meta"><span class="badge">{{ levelLabel() }}</span><span>{{ lesson().estimatedMinutes }} phút</span></div><h3><a [routerLink]="lesson().path">{{ lesson().title }}</a></h3><p>{{ lesson().description }}</p><footer><span>{{ lesson().technology }}</span><span class="status" [attr.data-status]="state.status(lesson().id)">{{ state.status(lesson().id) }}</span></footer></article>
